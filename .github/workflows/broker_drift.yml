name: Broker Drift Check

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 08:00 UTC
  workflow_dispatch:       # Allow manual trigger from the Actions tab

permissions:
  issues: write            # Required to open drift issues

jobs:
  verify:
    name: Verify broker selectors
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright Chromium
        run: uv run playwright install chromium --with-deps

      - name: Run broker verification
        id: verify
        run: |
          uv run optout verify 2>&1 | tee verify_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Open issue on drift
        if: steps.verify.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('verify_output.txt', 'utf8').trim();
            const today = new Date().toISOString().split('T')[0];
            const title = `Broker drift detected — ${today}`;

            // Check for an existing open drift issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'broker-drift',
              state: 'open',
            });

            if (issues.length > 0) {
              // Comment on the existing issue instead of opening a new one
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `**Weekly check ${today}** — drift still present:\n\`\`\`\n${output}\n\`\`\``,
              });
              core.notice(`Updated existing drift issue #${issues[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['broker-drift'],
                body: [
                  '## Broker Drift Detected',
                  '',
                  'The weekly `optout verify` run found selectors that no longer match live broker pages.',
                  'This usually means a broker updated their form — update the YAML selectors and re-run `optout verify --update`.',
                  '',
                  '```',
                  output,
                  '```',
                  '',
                  '### How to fix',
                  '1. Run `optout verify --broker <slug> --headed` locally to open the browser and inspect the form.',
                  '2. Update the broken selectors in `brokers/<slug>.yml`.',
                  '3. Run `optout verify --broker <slug> --update` to confirm and stamp `last_verified_at`.',
                  '4. Open a PR with the updated YAML.',
                ].join('\n'),
              });
              core.notice(`Opened drift issue #${issue.number}: ${issue.html_url}`);
            }
